name: 3proxy
version: "1.1.0"
slug: 3proxy
description: SOCKS5 proxy (3proxy)
arch:
  - aarch64
  - amd64
init: false
startup: services
boot: auto
host_network: true
options:
  listen: 0.0.0.0
  port: 1080
  username: ""
  password: ""
  allowed_sources:
    - 100.64.0.0/10
    - 127.0.0.1
schema:
  listen: str
  port: port
  username: match(^[A-Za-z0-9._-]+$)
  password: password
  allowed_sources:
    - match(^[0-9]{1,3}(\.[0-9]{1,3}){3}(/[0-9]{1,2})?$)
